hapi:
  fhir:
    fhir_version: R4
    server_id_strategy: UUID
    # Persist meta.source so externally-sourced records (e.g. HIE-delivered
    # resources) keep their provenance. Without this HAPI silently drops the
    # field on write. SOURCE_URI keeps the URI without appending a request id,
    # which keeps the value stable and matchable.
    store_meta_source_information: SOURCE_URI
    cors:
      allowed_origin:
        - "*"
    reuse_cached_search_results_millis: 1000
    validation:
      enabled: true
      requests_enabled: false

spring:
  datasource:
    url: jdbc:postgresql://postgres-hapi:5432/hapi
    username: hapi
    password: ${POSTGRES_HAPI_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
