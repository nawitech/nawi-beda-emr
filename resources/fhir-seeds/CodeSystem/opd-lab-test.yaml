name: NawiOpdLabTest
title: Nawi OPD lab test menu
status: active
experimental: false
content: complete
caseSensitive: true
description: >-
  Locally authored lab test menu. The clinic has no existing catalogue to seed from, so this
  starts from the common Kenyan outpatient tests listed in the OPD workflow guide section 4.4.
  NOT CLINICALLY REVIEWED — a laboratory lead must confirm the menu, and LOINC codes should be
  attached to each entry before results are exchanged with anyone outside this deployment.

  Swap procedure is identical to the diagnosis catalogue — see docs/opd-terminology.md.
