id: opd-diagnosis
resourceType: CodeSystem
url: https://emr.nawi.ke/fhir/CodeSystem/opd-diagnosis
name: NawiOpdDiagnosis
title: Nawi OPD diagnosis
status: active
experimental: false
content: complete
caseSensitive: true
description: >-
  Locally authored diagnosis codes for outpatient consultations. ICD-10 is not licensed for
  this deployment, so this stands in until a licensed or facility-supplied code system is
  available. The concepts below are a starting set for a Kenyan private outpatient clinic and
  HAVE NOT BEEN CLINICALLY REVIEWED — treat the list as a placeholder to be signed off by a
  clinician before any live use.

  Questionnaires must bind to ValueSet/opd-diagnosis by canonical URL and must never inline
  these codes as answerOption, so that swapping in ICD-10 is a seed change and nothing else.
  See docs/opd-implementation-plan.md section 10.
