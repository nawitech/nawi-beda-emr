description: >-
  Locally authored outpatient formulary, by generic name. The clinic has no existing formulary
  to seed from. NOT CLINICALLY REVIEWED — a pharmacist must confirm the list, and it carries no
  strengths, forms, interactions or contraindications. Prescribing safety checks are out of
  scope for V1; see docs/opd-implementation-plan.md.

  Swap procedure is identical to the diagnosis catalogue — see docs/opd-terminology.md.
