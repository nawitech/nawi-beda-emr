id: opd-triage
resourceType: Mapping
type: FHIRPath
body:
  "{% assign %}":
    - patientReference: "{{ 'Patient/' + %Patient.id }}"
    - encounterReference: "{{ 'Encounter/' + %Encounter.id }}"
    - authorReference: "{{ %Author.resourceType + '/' + %Author.id }}"
    - recordedAt: "{{ %QuestionnaireResponse.authored }}"
    # Every key below is derived from the visit, so a resubmitted form updates the same
    # observations and the same work items instead of duplicating the visit's triage.
    - visitKey: "{{ %Encounter.identifier.where(system = 'https://emr.nawi.ke/fhir/sid/opd-visit').value.first() }}"
    - presentingComplaint: "{{ %QuestionnaireResponse.answers('presenting-complaint') }}"
    - temperature: "{{ %QuestionnaireResponse.answers('temperature') }}"
    - heartRate: "{{ %QuestionnaireResponse.answers('heart-rate') }}"
    - respiratoryRate: "{{ %QuestionnaireResponse.answers('respiratory-rate') }}"
    - oxygenSaturation: "{{ %QuestionnaireResponse.answers('oxygen-saturation') }}"
    - systolicBloodPressure: "{{ %QuestionnaireResponse.answers('systolic-blood-pressure') }}"
    - diastolicBloodPressure: "{{ %QuestionnaireResponse.answers('diastolic-blood-pressure') }}"
    - weight: "{{ %QuestionnaireResponse.answers('weight') }}"
    # Respiratory rate, oxygen saturation and height are optional on the form (workflow guide
    # section 4.2), so their entries below are conditional: an unanswered vital produces no
    # Observation rather than an invalid one.
    - height: "{{ %QuestionnaireResponse.answers('height') }}"
    # FHIR request-priority code chosen by the nurse; written straight to the consultation Task.
    - priority: "{{ %QuestionnaireResponse.answers('priority').code }}"

  resourceType: Bundle
  type: transaction
  entry:
    - request:
        url: /Observation
        method: POST
        ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-observation|{{ %visitKey }}-presenting-complaint"
      resource:
        resourceType: Observation
        status: final
        identifier:
          - system: https://emr.nawi.ke/fhir/sid/opd-observation
            value: "{{ %visitKey }}-presenting-complaint"
        category:
          - coding:
              - system: http://terminology.hl7.org/CodeSystem/observation-category
                code: survey
                display: Survey
        code:
          coding:
            - system: http://loinc.org
              code: 8661-1
              display: Chief complaint
          text: Presenting complaint
        subject:
          reference: "{{ %patientReference }}"
        encounter:
          reference: "{{ %encounterReference }}"
        performer:
          - reference: "{{ %authorReference }}"
        effectiveDateTime: "{{ %recordedAt }}"
        valueString: "{{ %presentingComplaint }}"
    - request:
        url: /Observation
        method: POST
        ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-observation|{{ %visitKey }}-temperature"
      resource:
        resourceType: Observation
        status: final
        identifier:
          - system: https://emr.nawi.ke/fhir/sid/opd-observation
            value: "{{ %visitKey }}-temperature"
        category:
          - coding:
              - system: http://terminology.hl7.org/CodeSystem/observation-category
                code: vital-signs
                display: Vital Signs
        code:
          coding:
            - system: http://loinc.org
              code: 8310-5
              display: Body temperature
        subject:
          reference: "{{ %patientReference }}"
        encounter:
          reference: "{{ %encounterReference }}"
        performer:
          - reference: "{{ %authorReference }}"
        effectiveDateTime: "{{ %recordedAt }}"
        valueQuantity:
          value: "{{ %temperature }}"
          unit: °C
          system: http://unitsofmeasure.org
          code: Cel
    - request:
        url: /Observation
        method: POST
        ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-observation|{{ %visitKey }}-heart-rate"
      resource:
        resourceType: Observation
        status: final
        identifier:
          - system: https://emr.nawi.ke/fhir/sid/opd-observation
            value: "{{ %visitKey }}-heart-rate"
        category:
          - coding:
              - system: http://terminology.hl7.org/CodeSystem/observation-category
                code: vital-signs
                display: Vital Signs
        code:
          coding:
            - system: http://loinc.org
              code: 8867-4
              display: Heart rate
        subject:
          reference: "{{ %patientReference }}"
        encounter:
          reference: "{{ %encounterReference }}"
        performer:
          - reference: "{{ %authorReference }}"
        effectiveDateTime: "{{ %recordedAt }}"
        valueQuantity:
          value: "{{ %heartRate }}"
          unit: beats/minute
          system: http://unitsofmeasure.org
          code: /min
    - "{% if %respiratoryRate.exists() %}":
        request:
          url: /Observation
          method: POST
          ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-observation|{{ %visitKey }}-respiratory-rate"
        resource:
          resourceType: Observation
          status: final
          identifier:
            - system: https://emr.nawi.ke/fhir/sid/opd-observation
              value: "{{ %visitKey }}-respiratory-rate"
          category:
            - coding:
                - system: http://terminology.hl7.org/CodeSystem/observation-category
                  code: vital-signs
                  display: Vital Signs
          code:
            coding:
              - system: http://loinc.org
                code: 9279-1
                display: Respiratory rate
          subject:
            reference: "{{ %patientReference }}"
          encounter:
            reference: "{{ %encounterReference }}"
          performer:
            - reference: "{{ %authorReference }}"
          effectiveDateTime: "{{ %recordedAt }}"
          valueQuantity:
            value: "{{ %respiratoryRate }}"
            unit: breaths/minute
            system: http://unitsofmeasure.org
            code: /min
    - "{% if %oxygenSaturation.exists() %}":
        request:
          url: /Observation
          method: POST
          ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-observation|{{ %visitKey }}-oxygen-saturation"
        resource:
          resourceType: Observation
          status: final
          identifier:
            - system: https://emr.nawi.ke/fhir/sid/opd-observation
              value: "{{ %visitKey }}-oxygen-saturation"
          category:
            - coding:
                - system: http://terminology.hl7.org/CodeSystem/observation-category
                  code: vital-signs
                  display: Vital Signs
          code:
            coding:
              - system: http://loinc.org
                code: 2708-6
                display: Oxygen saturation in arterial blood
          subject:
            reference: "{{ %patientReference }}"
          encounter:
            reference: "{{ %encounterReference }}"
          performer:
            - reference: "{{ %authorReference }}"
          effectiveDateTime: "{{ %recordedAt }}"
          valueQuantity:
            value: "{{ %oxygenSaturation }}"
            unit: "%"
            system: http://unitsofmeasure.org
            code: "%"
    - "{% if %height.exists() %}":
        request:
          url: /Observation
          method: POST
          ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-observation|{{ %visitKey }}-height"
        resource:
          resourceType: Observation
          status: final
          identifier:
            - system: https://emr.nawi.ke/fhir/sid/opd-observation
              value: "{{ %visitKey }}-height"
          category:
            - coding:
                - system: http://terminology.hl7.org/CodeSystem/observation-category
                  code: vital-signs
                  display: Vital Signs
          code:
            coding:
              - system: http://loinc.org
                code: 8302-2
                display: Body height
          subject:
            reference: "{{ %patientReference }}"
          encounter:
            reference: "{{ %encounterReference }}"
          performer:
            - reference: "{{ %authorReference }}"
          effectiveDateTime: "{{ %recordedAt }}"
          valueQuantity:
            value: "{{ %height }}"
            unit: cm
            system: http://unitsofmeasure.org
            code: cm
    - request:
        url: /Observation
        method: POST
        ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-observation|{{ %visitKey }}-blood-pressure"
      resource:
        resourceType: Observation
        status: final
        identifier:
          - system: https://emr.nawi.ke/fhir/sid/opd-observation
            value: "{{ %visitKey }}-blood-pressure"
        category:
          - coding:
              - system: http://terminology.hl7.org/CodeSystem/observation-category
                code: vital-signs
                display: Vital Signs
        code:
          coding:
            - system: http://loinc.org
              code: 85354-9
              display: Blood pressure panel with all children optional
        subject:
          reference: "{{ %patientReference }}"
        encounter:
          reference: "{{ %encounterReference }}"
        performer:
          - reference: "{{ %authorReference }}"
        effectiveDateTime: "{{ %recordedAt }}"
        component:
          - code:
              coding:
                - system: http://loinc.org
                  code: 8480-6
                  display: Systolic blood pressure
            valueQuantity:
              value: "{{ %systolicBloodPressure }}"
              unit: mmHg
              system: http://unitsofmeasure.org
              code: mm[Hg]
          - code:
              coding:
                - system: http://loinc.org
                  code: 8462-4
                  display: Diastolic blood pressure
            valueQuantity:
              value: "{{ %diastolicBloodPressure }}"
              unit: mmHg
              system: http://unitsofmeasure.org
              code: mm[Hg]
    - request:
        url: /Observation
        method: POST
        ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-observation|{{ %visitKey }}-weight"
      resource:
        resourceType: Observation
        status: final
        identifier:
          - system: https://emr.nawi.ke/fhir/sid/opd-observation
            value: "{{ %visitKey }}-weight"
        category:
          - coding:
              - system: http://terminology.hl7.org/CodeSystem/observation-category
                code: vital-signs
                display: Vital Signs
        code:
          coding:
            - system: http://loinc.org
              code: 29463-7
              display: Body weight
        subject:
          reference: "{{ %patientReference }}"
        encounter:
          reference: "{{ %encounterReference }}"
        performer:
          - reference: "{{ %authorReference }}"
        effectiveDateTime: "{{ %recordedAt }}"
        valueQuantity:
          value: "{{ %weight }}"
          unit: kg
          system: http://unitsofmeasure.org
          code: kg

    # --- the transition ---------------------------------------------------------------
    # PATCH bodies must be FHIRPath Parameters; HAPI rejects a plain resource fragment with
    # HAPI-0537. See .claude/skills/beda-workflow/references/stack-compatibility.md.

    - request:
        method: PATCH
        url: "Task?identifier=https://emr.nawi.ke/fhir/sid/opd-task|{{ %visitKey }}-triage"
      resource:
        resourceType: Parameters
        parameter:
          - name: operation
            part:
              - name: type
                valueCode: replace
              - name: path
                valueString: Task.status
              - name: value
                valueCode: completed
          - name: operation
            part:
              - name: type
                valueCode: replace
              - name: path
                valueString: Task.businessStatus
              - name: value
                valueCodeableConcept:
                  coding:
                    - system: https://emr.nawi.ke/fhir/CodeSystem/opd-workflow-status
                      code: completed
                      display: Completed

    - request:
        method: PATCH
        url: "{{ %encounterReference }}"
      resource:
        resourceType: Parameters
        parameter:
          - name: operation
            part:
              - name: type
                valueCode: replace
              - name: path
                valueString: Encounter.status
              - name: value
                valueCode: triaged

    # Hand-off to the clinician. Keyed on the visit, so a resubmitted triage form reuses the
    # consultation work item rather than queueing the patient twice.
    - request:
        url: /Task
        method: POST
        ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-task|{{ %visitKey }}-consultation"
      resource:
        resourceType: Task
        status: ready
        intent: order
        identifier:
          - system: https://emr.nawi.ke/fhir/sid/opd-task
            value: "{{ %visitKey }}-consultation"
        code:
          coding:
            - system: https://emr.nawi.ke/fhir/CodeSystem/opd-task
              code: consultation
              display: OPD consultation
          text: OPD consultation
        businessStatus:
          coding:
            - system: https://emr.nawi.ke/fhir/CodeSystem/opd-workflow-status
              code: ready-for-consultation
              display: Ready for consultation
        priority: "{{ %priority }}"
        description: Review completed triage and conduct the outpatient consultation.
        focus:
          reference: "{{ %encounterReference }}"
        "for":
          reference: "{{ %patientReference }}"
        authoredOn: "{{ %recordedAt }}"
        requester:
          reference: "{{ %authorReference }}"
