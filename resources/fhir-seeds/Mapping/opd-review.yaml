id: opd-review
resourceType: Mapping
type: FHIRPath
body:
  "{% assign %}":
    - patientReference: "{{ 'Patient/' + %Patient.id }}"
    - encounterReference: "{{ 'Encounter/' + %Encounter.id }}"
    - authorReference: "{{ %Author.resourceType + '/' + %Author.id }}"
    - recordedAt: "{{ %QuestionnaireResponse.authored }}"
    - visitKey: "{{ %Encounter.identifier.where(system = 'https://emr.nawi.ke/fhir/sid/opd-visit').value.first() }}"
    - reviewedReport: "{{ %QuestionnaireResponse.answers('reviewed-report') }}"
    - outcome: "{{ %QuestionnaireResponse.answers('outcome') }}"
    - revisedDiagnosis: "{{ %QuestionnaireResponse.answers('revised-diagnosis') }}"
    - reviewNotes: "{{ %QuestionnaireResponse.answers('review-notes') }}"
    # {[ ]} captures a COLLECTION; {{ }} would collapse it to the first prescription.
    - rxRows: "{[ %QuestionnaireResponse.repeat(item).where(linkId='prescription') ]}"
    - hasPrescriptions: "{{ %QuestionnaireResponse.repeat(item).where(linkId='prescription').item.where(linkId='medication').answer.exists() }}"

  resourceType: Bundle
  type: transaction
  entry:
    # A ClinicalImpression, not an Observation.
    #
    # The first attempt used an Observation with basedOn pointing at the report, which HAPI
    # rejected: "HAPI-0931: Invalid reference found at path 'Observation.basedOn'. Resource
    # type 'DiagnosticReport' is not valid for this path." R4 restricts Observation.basedOn to
    # order-shaped resources, and derivedFrom does not accept DiagnosticReport either.
    #
    # ClinicalImpression is the resource for "a clinician assessed this and concluded that":
    # supportingInfo takes the report, problem takes the diagnosis, summary takes the note.
    # Reaching for the right resource beat bending Observation into the shape.
    - request:
        url: /ClinicalImpression
        method: POST
        ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-review|{{ %visitKey }}"
      resource:
        resourceType: ClinicalImpression
        identifier:
          - system: https://emr.nawi.ke/fhir/sid/opd-review
            value: "{{ %visitKey }}"
        status: completed
        code:
          coding:
            - "{{ %outcome }}"
        description: Review of laboratory results
        subject:
          reference: "{{ %patientReference }}"
        encounter:
          reference: "{{ %encounterReference }}"
        date: "{{ %recordedAt }}"
        assessor:
          reference: "{{ %authorReference }}"
        summary: "{{ %reviewNotes }}"
        supportingInfo:
          - "{{ %reviewedReport }}"

    # A revision is a new confirmed Condition. The provisional diagnosis from consultation is
    # left as it was: the clinical record should show what was thought at the time, not be
    # rewritten once the answer is known.
    - "{% if %revisedDiagnosis.exists() %}":
        request:
          url: /Condition
          method: POST
          ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-condition|{{ %visitKey }}-dx-revised"
        resource:
          resourceType: Condition
          identifier:
            - system: https://emr.nawi.ke/fhir/sid/opd-condition
              value: "{{ %visitKey }}-dx-revised"
          clinicalStatus:
            coding:
              - system: http://terminology.hl7.org/CodeSystem/condition-clinical
                code: active
                display: Active
          verificationStatus:
            coding:
              - system: http://terminology.hl7.org/CodeSystem/condition-ver-status
                code: confirmed
                display: Confirmed
          category:
            - coding:
                - system: http://terminology.hl7.org/CodeSystem/condition-category
                  code: encounter-diagnosis
                  display: Encounter Diagnosis
          code:
            coding:
              - "{{ %revisedDiagnosis }}"
          subject:
            reference: "{{ %patientReference }}"
          encounter:
            reference: "{{ %encounterReference }}"
          recordedDate: "{{ %recordedAt }}"
          recorder:
            reference: "{{ %authorReference }}"

    - request:
        method: PATCH
        url: "Task?identifier=https://emr.nawi.ke/fhir/sid/opd-task|{{ %visitKey }}-review"
      resource:
        resourceType: Parameters
        parameter:
          - name: operation
            part:
              - name: type
                valueCode: replace
              - name: path
                valueString: Task.status
              - name: value
                valueCode: completed
          - name: operation
            part:
              - name: type
                valueCode: replace
              - name: path
                valueString: Task.businessStatus
              - name: value
                valueCodeableConcept:
                  coding:
                    - system: https://emr.nawi.ke/fhir/CodeSystem/opd-workflow-status
                      code: completed
                      display: Completed

    # Definitive treatment, once the results are known.
    #
    # Keyed `-rx-review-` rather than `-rx-`, so prescribing the same drug here as at
    # consultation creates a second, separate order instead of silently colliding with the
    # first under `ifNoneExist`.
    - "{% for index, row in %rxRows %}":
        "{% assign %}":
          - medication: "{{ %row.item.where(linkId='medication').answer.valueCoding.first() }}"
          - dosage: "{{ %row.item.where(linkId='dosage').answer.valueString.first() }}"
          - duration: "{{ %row.item.where(linkId='duration').answer.valueInteger.first() }}"
        "{% if %medication.exists() %}":
          request:
            url: /MedicationRequest
            method: POST
            ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-prescription|{{ %visitKey }}-rx-review-{{ %medication.code }}"
          resource:
            resourceType: MedicationRequest
            identifier:
              - system: https://emr.nawi.ke/fhir/sid/opd-prescription
                value: "{{ %visitKey }}-rx-review-{{ %medication.code }}"
            status: active
            intent: order
            medicationCodeableConcept:
              coding:
                - "{{ %medication }}"
            subject:
              reference: "{{ %patientReference }}"
            encounter:
              reference: "{{ %encounterReference }}"
            authoredOn: "{{ %recordedAt }}"
            requester:
              reference: "{{ %authorReference }}"
            dosageInstruction:
              - text: "{{ %dosage }}"
            dispenseRequest:
              expectedSupplyDuration:
                value: "{{ %duration }}"
                unit: days
                system: http://unitsofmeasure.org
                code: d

    # Send the patient back to pharmacy.
    #
    # A conditional PUT, not a POST with ifNoneExist. The visit gets ONE pharmacy work item
    # (the same rule consultation follows), so this has to cover three states: no pharmacy
    # item yet, one still waiting, and one already `completed` because the patient collected
    # their consultation drugs earlier. `ifNoneExist` would match that completed item and
    # create nothing — the prescription would exist and never be dispensed. A conditional PUT
    # upserts: it creates the item, or reopens it to `ready`.
    #
    # Because the identifier is unchanged, opd-dispense completes it without any change there.
    - "{% if %hasPrescriptions %}":
        request:
          method: PUT
          url: "Task?identifier=https://emr.nawi.ke/fhir/sid/opd-task|{{ %visitKey }}-pharmacy"
        resource:
          resourceType: Task
          status: ready
          intent: order
          identifier:
            - system: https://emr.nawi.ke/fhir/sid/opd-task
              value: "{{ %visitKey }}-pharmacy"
          code:
            coding:
              - system: https://emr.nawi.ke/fhir/CodeSystem/opd-task
                code: pharmacy
                display: Pharmacy
            text: Pharmacy
          businessStatus:
            coding:
              - system: https://emr.nawi.ke/fhir/CodeSystem/opd-workflow-status
                code: ready-for-pharmacy
                display: Ready for pharmacy
          priority: routine
          description: Dispense the prescriptions written for this visit.
          focus:
            reference: "{{ %encounterReference }}"
          "for":
            reference: "{{ %patientReference }}"
          authoredOn: "{{ %recordedAt }}"
          requester:
            reference: "{{ %authorReference }}"

    # Billing always comes last.
    #
    # Both branches are a conditional PUT so the billing item ends in the right state whether
    # or not it already exists — pharmacy may have created it as `ready` before these results
    # came back, and taking payment now would send the patient home short of the drugs just
    # prescribed. `on-hold` keeps it out of the cashier's queue (which filters `status=ready`)
    # until opd-dispense releases it.
    - "{% if %hasPrescriptions %}":
        request:
          method: PUT
          url: "Task?identifier=https://emr.nawi.ke/fhir/sid/opd-task|{{ %visitKey }}-billing"
        resource:
          resourceType: Task
          status: on-hold
          intent: order
          identifier:
            - system: https://emr.nawi.ke/fhir/sid/opd-task
              value: "{{ %visitKey }}-billing"
          code:
            coding:
              - system: https://emr.nawi.ke/fhir/CodeSystem/opd-task
                code: billing
                display: Billing
            text: Billing
          businessStatus:
            coding:
              - system: https://emr.nawi.ke/fhir/CodeSystem/opd-workflow-status
                code: awaiting-pharmacy
                display: Awaiting pharmacy
          priority: routine
          description: Invoice the visit and take payment, once dispensing is done.
          focus:
            reference: "{{ %encounterReference }}"
          "for":
            reference: "{{ %patientReference }}"
          authoredOn: "{{ %recordedAt }}"
          requester:
            reference: "{{ %authorReference }}"

    - "{% if %hasPrescriptions.not() %}":
        request:
          method: PUT
          url: "Task?identifier=https://emr.nawi.ke/fhir/sid/opd-task|{{ %visitKey }}-billing"
        resource:
          resourceType: Task
          status: ready
          intent: order
          identifier:
            - system: https://emr.nawi.ke/fhir/sid/opd-task
              value: "{{ %visitKey }}-billing"
          code:
            coding:
              - system: https://emr.nawi.ke/fhir/CodeSystem/opd-task
                code: billing
                display: Billing
            text: Billing
          businessStatus:
            coding:
              - system: https://emr.nawi.ke/fhir/CodeSystem/opd-workflow-status
                code: ready-for-billing
                display: Ready for billing
          priority: routine
          description: Invoice the visit and take payment.
          focus:
            reference: "{{ %encounterReference }}"
          "for":
            reference: "{{ %patientReference }}"
          authoredOn: "{{ %recordedAt }}"
          requester:
            reference: "{{ %authorReference }}"
