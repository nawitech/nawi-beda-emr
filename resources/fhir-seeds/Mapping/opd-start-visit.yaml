id: opd-start-visit
resourceType: Mapping
type: FHIRPath
body:
  "{% assign %}":
    - patientReference: "{{ 'Patient/' + %Patient.id }}"
    - authorReference: "{{ %Author.resourceType + '/' + %Author.id }}"
    - startedAt: "{{ %QuestionnaireResponse.authored }}"
    # One visit per patient per day. Every downstream key is derived from this, so the whole
    # visit — Encounter and both Tasks — is idempotent under a resubmitted form. Revisit when
    # a patient legitimately needs two visits in one day; that needs a real visit counter.
    - visitKey: "{{ %Patient.id + '-' + %QuestionnaireResponse.authored.toString().substring(0, 10) }}"
    - visitType: "{{ %QuestionnaireResponse.answers('visit-type') }}"

  resourceType: Bundle
  type: transaction
  entry:
    - fullUrl: "urn:uuid:opd-encounter"
      request:
        url: /Encounter
        method: POST
        ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-visit|{{ %visitKey }}"
      resource:
        resourceType: Encounter
        status: arrived
        identifier:
          - system: https://emr.nawi.ke/fhir/sid/opd-visit
            value: "{{ %visitKey }}"
        # Encounter.class is the kind of visit (ActEncounterCode), not the current station.
        # Station lives on Task.code — see docs/opd-implementation-plan.md decision D1.
        class:
          system: http://terminology.hl7.org/CodeSystem/v3-ActCode
          code: AMB
          display: ambulatory
        type:
          - coding:
              - "{{ %visitType }}"
        subject:
          reference: "{{ %patientReference }}"
        period:
          start: "{{ %startedAt }}"

    - request:
        url: /Task
        method: POST
        ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-task|{{ %visitKey }}-triage"
      resource:
        resourceType: Task
        status: ready
        intent: order
        identifier:
          - system: https://emr.nawi.ke/fhir/sid/opd-task
            value: "{{ %visitKey }}-triage"
        code:
          coding:
            - system: https://emr.nawi.ke/fhir/CodeSystem/opd-task
              code: triage
              display: OPD triage
          text: OPD triage
        businessStatus:
          coding:
            - system: https://emr.nawi.ke/fhir/CodeSystem/opd-workflow-status
              code: ready-for-triage
              display: Ready for triage
        priority: routine
        description: Record presenting complaint and vital signs.
        focus:
          reference: "urn:uuid:opd-encounter"
        "for":
          reference: "{{ %patientReference }}"
        authoredOn: "{{ %startedAt }}"
        requester:
          reference: "{{ %authorReference }}"
