id: opd-consultation
resourceType: Mapping
type: FHIRPath
body:
  "{% assign %}":
    - patientReference: "{{ 'Patient/' + %Patient.id }}"
    - encounterReference: "{{ 'Encounter/' + %Encounter.id }}"
    - authorReference: "{{ %Author.resourceType + '/' + %Author.id }}"
    - recordedAt: "{{ %QuestionnaireResponse.authored }}"
    - visitKey: "{{ %Encounter.identifier.where(system = 'https://emr.nawi.ke/fhir/sid/opd-visit').value.first() }}"
    - primaryDiagnosis: "{{ %QuestionnaireResponse.answers('primary-diagnosis') }}"
    - secondaryDiagnosis: "{{ %QuestionnaireResponse.answers('secondary-diagnosis') }}"
    - certainty: "{{ %QuestionnaireResponse.answers('diagnosis-certainty') }}"
    - clinicalNotes: "{{ %QuestionnaireResponse.answers('clinical-notes') }}"
    # {[ ]} captures a COLLECTION; {{ }} would collapse it to the first value.
    - labRows: "{[ %QuestionnaireResponse.repeat(item).where(linkId='lab-order') ]}"
    - rxRows: "{[ %QuestionnaireResponse.repeat(item).where(linkId='prescription') ]}"
    - hasLabOrders: "{{ %QuestionnaireResponse.repeat(item).where(linkId='lab-order').item.where(linkId='lab-test').answer.exists() }}"
    - hasPrescriptions: "{{ %QuestionnaireResponse.repeat(item).where(linkId='prescription').item.where(linkId='medication').answer.exists() }}"
  resourceType: Bundle
  type: transaction
  entry:
    -   request:
          url: /Condition
          method: POST
          ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-condition|{{ %visitKey }}-dx-primary"
        resource:
          resourceType: Condition
          identifier:
            - system: https://emr.nawi.ke/fhir/sid/opd-condition
              value: "{{ %visitKey }}-dx-primary"
          clinicalStatus:
            coding:
              - system: http://terminology.hl7.org/CodeSystem/condition-clinical
                code: active
                display: Active
          verificationStatus:
            coding:
              - "{{ %certainty }}"
          category:
            - coding:
                - system: http://terminology.hl7.org/CodeSystem/condition-category
                  code: encounter-diagnosis
                  display: Encounter Diagnosis
          code:
            coding:
              - "{{ %primaryDiagnosis }}"
          subject:
            reference: "{{ %patientReference }}"
          encounter:
            reference: "{{ %encounterReference }}"
          recordedDate: "{{ %recordedAt }}"
          recorder:
            reference: "{{ %authorReference }}"
    - "{% if %secondaryDiagnosis.exists() %}":
        request:
          url: /Condition
          method: POST
          ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-condition|{{ %visitKey }}-dx-secondary"
        resource:
          resourceType: Condition
          identifier:
            - system: https://emr.nawi.ke/fhir/sid/opd-condition
              value: "{{ %visitKey }}-dx-secondary"
          clinicalStatus:
            coding:
              - system: http://terminology.hl7.org/CodeSystem/condition-clinical
                code: active
                display: Active
          verificationStatus:
            coding:
              - "{{ %certainty }}"
          category:
            - coding:
                - system: http://terminology.hl7.org/CodeSystem/condition-category
                  code: encounter-diagnosis
                  display: Encounter Diagnosis
          code:
            coding:
              - "{{ %secondaryDiagnosis }}"
          subject:
            reference: "{{ %patientReference }}"
          encounter:
            reference: "{{ %encounterReference }}"
          recordedDate: "{{ %recordedAt }}"
          recorder:
            reference: "{{ %authorReference }}"
    - request:
        url: /Observation
        method: POST
      resource:
        resourceType: Observation
        status: final
        category:
          - coding:
              - system: http://terminology.hl7.org/CodeSystem/observation-category
                code: exam
                display: Exam
        code:
          coding:
            - system: http://loinc.org
              code: 51847-2
              display: Evaluation + Plan note
          text: Consultation note
        subject:
          reference: "{{ %patientReference }}"
        encounter:
          reference: "{{ %encounterReference }}"
        performer:
          - reference: "{{ %authorReference }}"
        effectiveDateTime: "{{ %recordedAt }}"
        valueString: "{{ %clinicalNotes }}"
    # One ServiceRequest per row. Identifiers key on the test code rather than the row
    # position, so reordering rows on a resubmit updates in place instead of orphaning.
    - "{% for index, row in %labRows %}":
        "{% assign %}":
          - labTest: "{{ %row.item.where(linkId='lab-test').answer.valueCoding.first() }}"
        "{% if %labTest.exists() %}":
          request:
            url: /ServiceRequest
            method: POST
            ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-lab-order|{{ %visitKey }}-lab-{{ %labTest.code }}"
          resource:
            resourceType: ServiceRequest
            identifier:
              - system: https://emr.nawi.ke/fhir/sid/opd-lab-order
                value: "{{ %visitKey }}-lab-{{ %labTest.code }}"
            status: active
            intent: order
            category:
              - coding:
                  - system: http://snomed.info/sct
                    code: "108252007"
                    display: Laboratory procedure
            code:
              coding:
                - "{{ %labTest }}"
            subject:
              reference: "{{ %patientReference }}"
            encounter:
              reference: "{{ %encounterReference }}"
            authoredOn: "{{ %recordedAt }}"
            requester:
              reference: "{{ %authorReference }}"

    - "{% for index, row in %rxRows %}":
        "{% assign %}":
          - medication: "{{ %row.item.where(linkId='medication').answer.valueCoding.first() }}"
          - dosage: "{{ %row.item.where(linkId='dosage').answer.valueString.first() }}"
          - duration: "{{ %row.item.where(linkId='duration').answer.valueInteger.first() }}"
        "{% if %medication.exists() %}":
          request:
            url: /MedicationRequest
            method: POST
            ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-prescription|{{ %visitKey }}-rx-{{ %medication.code }}"
          resource:
            resourceType: MedicationRequest
            identifier:
              - system: https://emr.nawi.ke/fhir/sid/opd-prescription
                value: "{{ %visitKey }}-rx-{{ %medication.code }}"
            status: active
            intent: order
            medicationCodeableConcept:
              coding:
                - "{{ %medication }}"
            subject:
              reference: "{{ %patientReference }}"
            encounter:
              reference: "{{ %encounterReference }}"
            authoredOn: "{{ %recordedAt }}"
            requester:
              reference: "{{ %authorReference }}"
            dosageInstruction:
              - text: "{{ %dosage }}"
            dispenseRequest:
              expectedSupplyDuration:
                value: "{{ %duration }}"
                unit: days
                system: http://unitsofmeasure.org
                code: d

    # --- the transition ---------------------------------------------------------------
    # PATCH bodies must be FHIRPath Parameters; HAPI rejects a plain resource fragment with
    # HAPI-0537. See .claude/skills/beda-workflow/references/stack-compatibility.md.

    - request:
        method: PATCH
        url: "Task?identifier=https://emr.nawi.ke/fhir/sid/opd-task|{{ %visitKey }}-consultation"
      resource:
        resourceType: Parameters
        parameter:
          - name: operation
            part:
              - name: type
                valueCode: replace
              - name: path
                valueString: Task.status
              - name: value
                valueCode: completed
          - name: operation
            part:
              - name: type
                valueCode: replace
              - name: path
                valueString: Task.businessStatus
              - name: value
                valueCodeableConcept:
                  coding:
                    - system: https://emr.nawi.ke/fhir/CodeSystem/opd-workflow-status
                      code: completed
                      display: Completed

    - request:
        method: PATCH
        url: "{{ %encounterReference }}"
      resource:
        resourceType: Parameters
        parameter:
          - name: operation
            part:
              - name: type
                valueCode: replace
              - name: path
                valueString: Encounter.status
              - name: value
                valueCode: in-progress

    # Hand-offs. A consultation can produce both, either, or neither: the patient goes to the
    # lab, to the pharmacy, to both, or straight on. Each station gets at most one work item
    # per visit regardless of how many individual orders were written.
    - "{% if %hasLabOrders %}":
        request:
          url: /Task
          method: POST
          ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-task|{{ %visitKey }}-lab"
        resource:
          resourceType: Task
          status: ready
          intent: order
          identifier:
            - system: https://emr.nawi.ke/fhir/sid/opd-task
              value: "{{ %visitKey }}-lab"
          code:
            coding:
              - system: https://emr.nawi.ke/fhir/CodeSystem/opd-task
                code: lab
                display: Laboratory
            text: Laboratory
          businessStatus:
            coding:
              - system: https://emr.nawi.ke/fhir/CodeSystem/opd-workflow-status
                code: ready-for-lab
                display: Ready for laboratory
          priority: routine
          description: Collect samples and record results for the ordered tests.
          focus:
            reference: "{{ %encounterReference }}"
          "for":
            reference: "{{ %patientReference }}"
          authoredOn: "{{ %recordedAt }}"
          requester:
            reference: "{{ %authorReference }}"

    - "{% if %hasPrescriptions %}":
        request:
          url: /Task
          method: POST
          ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-task|{{ %visitKey }}-pharmacy"
        resource:
          resourceType: Task
          status: ready
          intent: order
          identifier:
            - system: https://emr.nawi.ke/fhir/sid/opd-task
              value: "{{ %visitKey }}-pharmacy"
          code:
            coding:
              - system: https://emr.nawi.ke/fhir/CodeSystem/opd-task
                code: pharmacy
                display: Pharmacy
            text: Pharmacy
          businessStatus:
            coding:
              - system: https://emr.nawi.ke/fhir/CodeSystem/opd-workflow-status
                code: ready-for-pharmacy
                display: Ready for pharmacy
          priority: routine
          description: Verify the prescription and dispense.
          focus:
            reference: "{{ %encounterReference }}"
          "for":
            reference: "{{ %patientReference }}"
          authoredOn: "{{ %recordedAt }}"
          requester:
            reference: "{{ %authorReference }}"

    # If the consultation ordered nothing, there is no downstream station to hand off to and
    # the patient goes straight to the till. When labs or prescriptions were ordered, whichever
    # of review/pharmacy finishes last creates this instead.
    - "{% if %hasLabOrders.not() and %hasPrescriptions.not() %}":
        request:
          url: /Task
          method: POST
          ifNoneExist: "identifier=https://emr.nawi.ke/fhir/sid/opd-task|{{ %visitKey }}-billing"
        resource:
          resourceType: Task
          status: ready
          intent: order
          identifier:
            - system: https://emr.nawi.ke/fhir/sid/opd-task
              value: "{{ %visitKey }}-billing"
          code:
            coding:
              - system: https://emr.nawi.ke/fhir/CodeSystem/opd-task
                code: billing
                display: Billing
            text: Billing
          businessStatus:
            coding:
              - system: https://emr.nawi.ke/fhir/CodeSystem/opd-workflow-status
                code: ready-for-billing
                display: Ready for billing
          priority: routine
          description: Invoice the visit and take payment.
          focus:
            reference: "{{ %encounterReference }}"
          "for":
            reference: "{{ %patientReference }}"
          authoredOn: "{{ %recordedAt }}"
          requester:
            reference: "{{ %authorReference }}"
