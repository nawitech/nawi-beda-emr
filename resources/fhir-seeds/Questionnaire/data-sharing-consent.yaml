id: data-sharing-consent
resourceType: Questionnaire
name: data-sharing-consent
title: Consent to share medical record
status: active
description: >-
  Captures the patient's consent to share their medical record with a referred
  clinician.
subjectType:
  - Patient
mapping:
  - valueReference:
      reference: Mapping/data-sharing-consent
launchContext:
  - name:
      code: Patient
    type:
      - Patient
  - name:
      code: Author
    type:
      - Practitioner
item:
  - linkId: recipient
    type: reference
    text: Share record with
    required: true
    referenceResource:
      - Practitioner
    answerExpression:
      language: application/x-fhir-query
      expression: Practitioner
    choiceColumn:
      - forDisplay: true
        path: "name.given.first() + ' ' + name.family"
  - linkId: provision
    type: choice
    text: Decision
    required: true
    answerOption:
      - valueCoding:
          system: http://hl7.org/fhir/consent-provision-type
          code: permit
          display: Permit — patient consents to share
      - valueCoding:
          system: http://hl7.org/fhir/consent-provision-type
          code: deny
          display: Deny — patient withholds consent
  - linkId: date-start
    type: date
    text: Valid from
    required: true
  - linkId: date-end
    type: date
    text: Valid until
    required: true
meta:
  profile:
    - https://emr-core.beda.software/StructureDefinition/fhir-emr-questionnaire
url: https://emr.nawi.ke/fhir/Questionnaire/data-sharing-consent
