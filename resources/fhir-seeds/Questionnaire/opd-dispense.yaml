id: opd-dispense
resourceType: Questionnaire
name: opd-dispense
title: Dispense medication
status: active
description: >-
  Pharmacist's dispensing record. Launched from the pharmacy queue, which supplies Patient and
  Encounter context. Shows one block per prescribed medicine and closes the prescriptions
  and the pharmacy work item.
subjectType:
  - Encounter
launchContext:
  - name:
      code: Patient
    type:
      - Patient
  - name:
      code: Encounter
    type:
      - Encounter
  - name:
      code: Author
    type:
      - Practitioner
      - Organization
mapping:
  - valueReference:
      reference: Mapping/opd-dispense
item:
  # The lookup sits in a wrapper group, as in the billing and lab forms.
  - linkId: prescriptions
    type: group
    text: Prescribed medication
    variable:
      - name: openPrescriptions
        language: application/x-fhir-query
        expression: "MedicationRequest?encounter={{ %Encounter.id }}&status=active&_count=100&_format=json"
    item:
      # One block per prescription, created automatically from the lookup above.
      - linkId: dispense
        type: group
        text: Medication
        repeats: true
        itemPopulationContext:
          language: text/fhirpath
          expression: "%openPrescriptions.entry.resource.where(resourceType='MedicationRequest')"
        item:
          - linkId: prescription-id
            type: string
            text: Prescription id
            hidden: true
            readOnly: true
            initialExpression:
              language: text/fhirpath
              expression: "id"
          - linkId: medication-name
            type: string
            text: Medication
            readOnly: true
            initialExpression:
              language: text/fhirpath
              expression: "medicationCodeableConcept.coding.first().display"
          - linkId: prescribed-dosage
            type: string
            text: Dosage prescribed
            readOnly: true
            initialExpression:
              language: text/fhirpath
              expression: "dosageInstruction.first().text"
          - linkId: prescribed-duration
            type: string
            text: Duration
            readOnly: true
            initialExpression:
              language: text/fhirpath
              expression: "iif(dispenseRequest.expectedSupplyDuration.value.exists(), dispenseRequest.expectedSupplyDuration.value.toString() + ' days', '')"
          - linkId: dispense-quantity
            type: integer
            text: Quantity dispensed
            required: true
  - linkId: counselling-given
    type: boolean
    text: Patient counselled on use
meta:
  profile:
    - https://emr-core.beda.software/StructureDefinition/fhir-emr-questionnaire
url: https://emr.nawi.ke/fhir/Questionnaire/opd-dispense