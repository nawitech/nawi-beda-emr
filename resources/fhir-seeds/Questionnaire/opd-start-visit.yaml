id: opd-start-visit
resourceType: Questionnaire
name: opd-start-visit
title: Start OPD visit
status: active
description: >-
  Reception action. Opens an outpatient Encounter for a patient who has arrived and places
  them in the triage queue.
subjectType:
  - Patient
launchContext:
  - name:
      code: Patient
    type:
      - Patient
  - name:
      code: Author
    type:
      - Practitioner
      - Organization
mapping:
  - valueReference:
      reference: Mapping/opd-start-visit
item:
  - linkId: visit-details
    type: group
    # Looks up how many past visits this patient has.
    variable:
      - name: previousEncounters
        language: application/x-fhir-query
        expression: "Encounter?patient={{ %Patient.id }}&_summary=count&_format=json"
    item:
      - linkId: has-history
        type: boolean
        text: Has previous visits
        hidden: true
        readOnly: true
        initialExpression:
          language: text/fhirpath
          expression: "%previousEncounters.total > 0"
      - linkId: visit-type
        type: choice
        text: Visit type
        initial:
          - valueCoding:
              system: http://fhir.org/guides/argonaut-scheduling/CodeSystem/visit-type
              code: consultation
              display: New consultation
        answerOption:
          - valueCoding:
              system: http://fhir.org/guides/argonaut-scheduling/CodeSystem/visit-type
              code: consultation
              display: New consultation
        enableWhenExpression:
          language: text/fhirpath
          expression: "iif(%resource.repeat(item).where(linkId='has-history').answer.valueBoolean = true, false, true)"
      - linkId: visit-type-return
        type: choice
        text: Visit type
        initial:
          - valueCoding:
              system: http://fhir.org/guides/argonaut-scheduling/CodeSystem/visit-type
              code: consultation
              display: New consultation
        answerOption:
          - valueCoding:
              system: http://fhir.org/guides/argonaut-scheduling/CodeSystem/visit-type
              code: consultation
              display: New consultation
          - valueCoding:
              system: http://fhir.org/guides/argonaut-scheduling/CodeSystem/visit-type
              code: follow-up
              display: Follow-up visit
        enableWhenExpression:
          language: text/fhirpath
          expression: "%resource.repeat(item).where(linkId='has-history').answer.valueBoolean = true"
meta:
  profile:
    - https://emr-core.beda.software/StructureDefinition/fhir-emr-questionnaire
url: https://emr.nawi.ke/fhir/Questionnaire/opd-start-visit