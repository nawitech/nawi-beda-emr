id: opd-lab-results
resourceType: Questionnaire
name: opd-lab-results
title: Laboratory results
status: active
description: >-
  Lab technician's record of sample collection and results for a visit. Launched from the lab
  queue, which supplies Patient and Encounter context. Shows one block per requested test and
  completes the ordered ServiceRequests and the lab work item.
subjectType:
  - Encounter
launchContext:
  - name:
      code: Patient
    type:
      - Patient
  - name:
      code: Encounter
    type:
      - Encounter
  - name:
      code: Author
    type:
      - Practitioner
      - Organization
mapping:
  - valueReference:
      reference: Mapping/opd-lab-results
item:
  # The lookup sits in a wrapper group, as in the billing form, so the form can use it.
  # The query ends in &_format=json for the reason explained in the billing form.
  - linkId: tests
    type: group
    text: Requested tests
    variable:
      - name: labOrders
        language: application/x-fhir-query
        expression: "ServiceRequest?encounter={{ %Encounter.id }}&status=active&_count=100&_format=json"
    item:
      # One block per requested test, created automatically from the lookup above.
      - linkId: result
        type: group
        text: Test
        repeats: true
        itemPopulationContext:
          language: text/fhirpath
          expression: "%labOrders.entry.resource.where(resourceType='ServiceRequest')"
        item:
          - linkId: order-id
            type: string
            text: Order id
            hidden: true
            readOnly: true
            initialExpression:
              language: text/fhirpath
              expression: "id"
          - linkId: order-name
            type: string
            text: Test
            readOnly: true
            initialExpression:
              language: text/fhirpath
              expression: "code.coding.first().display"
          - linkId: specimen-type
            type: choice
            text: Specimen collected
            required: true
            answerOption:
              - valueCoding:
                  system: http://terminology.hl7.org/CodeSystem/v2-0487
                  code: BLD
                  display: Blood
              - valueCoding:
                  system: http://terminology.hl7.org/CodeSystem/v2-0487
                  code: UR
                  display: Urine
              - valueCoding:
                  system: http://terminology.hl7.org/CodeSystem/v2-0487
                  code: STL
                  display: Stool
              - valueCoding:
                  system: http://terminology.hl7.org/CodeSystem/v2-0487
                  code: SWA
                  display: Swab
          - linkId: result-value
            type: string
            text: Result
            required: true
          - linkId: result-interpretation
            type: choice
            text: Interpretation
            answerOption:
              - valueCoding:
                  system: http://terminology.hl7.org/CodeSystem/v3-ObservationInterpretation
                  code: N
                  display: Normal
              - valueCoding:
                  system: http://terminology.hl7.org/CodeSystem/v3-ObservationInterpretation
                  code: A
                  display: Abnormal
  - linkId: conclusion
    type: text
    text: Conclusion
meta:
  profile:
    - https://emr-core.beda.software/StructureDefinition/fhir-emr-questionnaire
url: https://emr.nawi.ke/fhir/Questionnaire/opd-lab-results