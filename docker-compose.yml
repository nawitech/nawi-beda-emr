services:
  postgres-keycloak:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
    volumes:
      - keycloak_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
      # KC_HOSTNAME: 35.202.40.190
      KC_HOSTNAME: host.docker.internal
      # KC_HOSTNAME_URL: http://35.202.40.190:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      - postgres-keycloak
    volumes:
      - ./resources/keycloak-seeds:/opt/keycloak/data/import:ro

  hapi-fhir:
    image: hapiproject/hapi:latest
    ports:
      - "8082:8080"
    environment:
      - hapi.fhir.fhir_version=R4
      - hapi.fhir.cors.allowed_origin=*

  keycloak-ready:
    image: curlimages/curl
    depends_on:
      - keycloak
    restart: on-failure
    command:
      - sh
      - -c
      - "until curl -sf http://keycloak:9000/health/ready; do echo 'Waiting for Keycloak...'; sleep 10; done"

  hapi-fhir-ready:
    image: curlimages/curl
    depends_on:
      - hapi-fhir
    restart: on-failure
    command:
      - sh
      - -c
      - "until curl -sf http://hapi-fhir:8080/actuator/health; do echo 'Waiting for HAPI...'; sleep 10; done"

  fhir-gateway:
    image: us-docker.pkg.dev/fhir-proxy-build/stable/fhir-gateway:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8084:8080"
    environment:
      # Proxy target — internal Docker DNS, no auth required (HAPI is network-isolated)
      - PROXY_TO=http://hapi-fhir:8080/fhir
      - BACKEND_TYPE=HAPI
      # Must exactly match the `iss` claim in Keycloak-issued JWTs.
      # KC_HOSTNAME_URL above pins Keycloak to this public URL, so the claim is consistent.
      # - TOKEN_ISSUER=http://35.202.40.190:8080/realms/beda-emr
      - TOKEN_ISSUER=http://host.docker.internal:8080/realms/beda-emr
      # Access checker — requires each JWT to carry a `patient_list` claim referencing
      # a FHIR List resource in HAPI.
      - ACCESS_CHECKER=list
      # Disable SSL validation for HTTP-only dev/connectathon environment
      - RUN_MODE=DEV
      - ALLOW_CORS=true
      - ALLOWED_QUERIES_FILE=/app/config/hapi_allowed_queries.json
    volumes:
      - ./gateway-config/hapi_allowed_queries.json:/app/config/hapi_allowed_queries.json:ro
    depends_on:
      hapi-fhir-ready:
        condition: service_completed_successfully
      keycloak-ready:
        condition: service_completed_successfully

  beda-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - fhir-gateway

  fhir-sdc:
    image: bedasoftware/fhir-sdc:2.1.0a1
    ports:
      - "8083:8081"
    environment:
      - BASE_URL=http://hapi-fhir:8080/fhir
      - CONSTRAINT_LEGACY_BEHAVIOR=False
      - CREATE_MANIFEST_ATTRS=False
    depends_on:
      - hapi-fhir

  build-fhir-bundle:
    image: bedasoftware/fhirsnake:latest
    command:
      - export
      - --output
      - /app/fhir-bundles/fhirBundle.json
    volumes:
      - ./resources/fhir-seeds:/app/resources
      - ./resources/fhir-bundles:/app/fhir-bundles

  watch-fhir-seeds:
    image: bedasoftware/fhirsnake:latest
    command:
      - watch
      - --external-fhir-server-url
      - http://hapi-fhir:8080/fhir
    volumes:
      - ./resources/fhir-seeds:/app/resources

  upload-fhir-bundle:
    image: curlimages/curl
    depends_on:
      hapi-fhir-ready:
        condition: service_completed_successfully
      build-fhir-bundle:
        condition: service_completed_successfully
    working_dir: /app/resources/fhir-bundles
    command:
      - "sh"
      - "-c"
      - "curl -X POST 'http://hapi-fhir:8080/fhir' -H 'Content-Type: application/json' -d @fhirBundle.json"
    volumes:
      - ./resources/fhir-bundles/:/app/resources/fhir-bundles

volumes:
  keycloak_data:
